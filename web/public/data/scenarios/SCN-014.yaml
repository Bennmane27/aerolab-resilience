# SCN-014 - Replay regression
# A nominal run on the turning approach profile, used as the reference for deterministic replay and for the native / wasm parity check.
#
# Objective: Reproducibility (AT-001, AT-009, AT-014).
#
# Safety: every fault below is arithmetic applied to synthetic measurements
# inside this process. There is no radio, no signal generator and no receiver
# parameter anywhere in the project. See SECURITY_AND_SAFETY.md.

id: SCN-014
name: "Replay regression"
description: "A nominal run on the turning approach profile, used as the reference for deterministic replay and for the native / wasm parity check."
objective: "Reproducibility (AT-001, AT-009, AT-014)."

schema_version: 1
seed: 424242
duration_s: 120
dt_s: 0.01
truth_profile: approach_turn

scene:
  runway_heading_deg: 140.0
  glideslope_deg: 3.0
  threshold_ned_m: [0.0, 0.0, 0.0]
  runway_length_m: 3000.0
  runway_width_m: 45.0

sensors:
  gnss:
    enabled: true
    rate_hz: 5.0
    sigma_position_horizontal_m: 2.0
    sigma_position_vertical_m: 3.5
    sigma_velocity_mps: 0.10
    latency_s: 0.08
  imu:
    enabled: true
    rate_hz: 100.0
    accel_noise_density_mps2_sqrthz: 0.003
    gyro_noise_density_radps_sqrthz: 0.0002
    accel_bias_walk_mps2_sqrts: 0.0001
    gyro_bias_walk_radps_sqrts: 0.00001
  baro:
    enabled: true
    rate_hz: 20.0
    sigma_m: 0.6
  vision:
    enabled: true
    rate_hz: 20.0
    sigma_lateral_m: 0.8
    sigma_longitudinal_m: 3.0
    max_range_m: 3000.0

estimators: [gnss_only, ins_dr, ekf, integrity_ekf, solsep_ekf]

faults: []

acceptance:
  - id: AC-1
    description: The reference regression run must stay clean end to end.
    estimator: integrity_ekf
    max_false_isolations: 0
