# SCN-001 - Nominal approach
# No fault. Establishes the reference accuracy and, above all, the false alert budget that every other scenario is judged against.
#
# Objective: Reference accuracy and false alert rate (AT-003, INT-020).
#
# Safety: every fault below is arithmetic applied to synthetic measurements
# inside this process. There is no radio, no signal generator and no receiver
# parameter anywhere in the project. See SECURITY_AND_SAFETY.md.

id: SCN-001
name: "Nominal approach"
description: "No fault. Establishes the reference accuracy and, above all, the false alert budget that every other scenario is judged against."
objective: "Reference accuracy and false alert rate (AT-003, INT-020)."

schema_version: 1
seed: 101
duration_s: 90
dt_s: 0.01
truth_profile: approach_ils_like

scene:
  runway_heading_deg: 140.0
  glideslope_deg: 3.0
  threshold_ned_m: [0.0, 0.0, 0.0]
  runway_length_m: 3000.0
  runway_width_m: 45.0

sensors:
  gnss:
    enabled: true
    rate_hz: 5.0
    sigma_position_horizontal_m: 2.0
    sigma_position_vertical_m: 3.5
    sigma_velocity_mps: 0.10
    latency_s: 0.08
  imu:
    enabled: true
    rate_hz: 100.0
    accel_noise_density_mps2_sqrthz: 0.003
    gyro_noise_density_radps_sqrthz: 0.0002
    accel_bias_walk_mps2_sqrts: 0.0001
    gyro_bias_walk_radps_sqrts: 0.00001
  baro:
    enabled: true
    rate_hz: 20.0
    sigma_m: 0.6
  vision:
    enabled: true
    rate_hz: 20.0
    sigma_lateral_m: 0.8
    sigma_longitudinal_m: 3.0
    max_range_m: 3000.0

estimators: [gnss_only, ins_dr, ekf, integrity_ekf, solsep_ekf]

faults: []

acceptance:
  - id: AC-1
    description: A nominal run must not isolate any source. This is the false alert budget of INT-020.
    estimator: integrity_ekf
    max_false_isolations: 0
  - id: AC-2
    description: Same requirement for solution separation. A second line of defence that fires without a fault is worse than no second line.
    estimator: solsep_ekf
    max_false_isolations: 0
  - id: AC-3
    description: >
      The fused solution must stay usable throughout. The end mode is NOT
      required to be NORMAL: by the end of a 90 s run the aircraft has landed
      and rolled past the runway, so the vision sensor legitimately has nothing
      left to look at and the architecture correctly reports DEGRADED. Requiring
      NORMAL here would be asserting a geometric impossibility.
    estimator: integrity_ekf
    min_availability: 0.99
    forbid_end_mode: UNSAFE
