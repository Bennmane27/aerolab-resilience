# AEROLAB RESILIENCE - native build, tests and sanitizers.
# Requirements: VNV-004, VNV-005, VNV-008, AT-010, AT-011, NFR-001.
name: ci-native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: debug,   compiler: gcc,   cc: gcc,   cxx: g++ }
          - { preset: release, compiler: gcc,   cc: gcc,   cxx: g++ }
          - { preset: asan,    compiler: clang, cc: clang, cxx: clang++ }
          - { preset: ubsan,   compiler: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j
      # AT-010: the sanitizer presets must come back clean, not merely finish.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  scenario-regression:
    name: fourteen scenario regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - run: cmake --preset release && cmake --build build/release -j
      # VNV-020: every catalogue scenario runs and satisfies its own acceptance
      # block before anything is released.
      - name: Run every scenario
        run: |
          mkdir -p results
          failed=0
          for f in scenarios/SCN-*.yaml; do
            if ! ./build/release/bin/aerolab_cli --scenario "$f" \
                 --config configs/evaluation.json --out results --quiet; then
              echo "::error file=$f::scenario failed its acceptance block"
              failed=1
            fi
          done
          exit $failed
      - name: Smoke campaign
        run: ./build/release/bin/aerolab_bench --suite benchmark/smoke.yaml --out results/smoke --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-results
          path: results/

  coverage:
    name: coverage (VNV-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - run: pipx install gcovr
      # A clean tree: a stale .gcno beside a rebuilt source is one of the ways
      # this measurement goes wrong without saying so.
      - run: rm -rf build/coverage
      - run: cmake --preset coverage && cmake --build build/coverage -j
      - run: ctest --preset coverage --output-on-failure
      # VNV-008: >= 90 % lines over core/.
      #
      # gcovr rather than lcov, and the gcov binary pinned to the compiler that
      # produced the notes. The previous lcov invocation reported 87.6 % from
      # --summary and 10.9 % from --list on the SAME tracefile, with 0 %
      # function coverage in every file and one file at 117 % lines - all of it
      # masked by `--ignore-errors mismatch,gcov,source`, which suppressed
      # exactly the errors that would have named the problem. A gate whose
      # number cannot be reproduced by a second reading of its own output is
      # not a gate, so the measurement was replaced rather than the threshold.
      #
      # ONE tolerated parse error, and only one. gcov reports absurd hit counts
      # on heavily inlined accessors - 46 billion calls on Mat::operator() -
      # which is GCC bug 68080 and nothing to do with this code. That corrupts
      # the COUNT, not the fact that the line executed, and line coverage only
      # asks whether it executed. This is not the blanket suppression removed
      # above: `mismatch,gcov,source` hides structural disagreement between the
      # notes and the source, which does invalidate the result.
      - name: Measure and enforce the line coverage floor
        run: |
          gcov_bin="gcov-$(gcc -dumpversion | cut -d. -f1)"
          command -v "$gcov_bin" >/dev/null || gcov_bin=gcov
          echo "gcc $(gcc -dumpversion), reading notes with $gcov_bin"
          gcovr --root . \
                --gcov-executable "$gcov_bin" \
                --filter 'core/' \
                --exclude '.*/_deps/.*' \
                --gcov-ignore-parse-errors suspicious_hits.warn_once_per_file \
                --print-summary \
                --txt coverage-summary.txt \
                --cobertura coverage.xml \
                --fail-under-line 90.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-summary.txt
