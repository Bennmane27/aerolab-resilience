# SCN-012 - Dual fault
# A GNSS step spoof and an accelerometer bias, both from t=30 s. The redundancy needed to arbitrate between them is gone.
#
# Objective: Behaviour at the limit of the architecture. The correct answer is to declare low confidence, not to force a solution (INT-013, INT-014).
#
# Safety: every fault below is arithmetic applied to synthetic measurements
# inside this process. There is no radio, no signal generator and no receiver
# parameter anywhere in the project. See SECURITY_AND_SAFETY.md.

id: SCN-012
name: "Dual fault"
description: "A GNSS step spoof and an accelerometer bias, both from t=30 s. The redundancy needed to arbitrate between them is gone."
objective: "Behaviour at the limit of the architecture. The correct answer is to declare low confidence, not to force a solution (INT-013, INT-014)."

schema_version: 1
seed: 112
duration_s: 90
dt_s: 0.01
truth_profile: approach_ils_like

scene:
  runway_heading_deg: 140.0
  glideslope_deg: 3.0
  threshold_ned_m: [0.0, 0.0, 0.0]
  runway_length_m: 3000.0
  runway_width_m: 45.0

sensors:
  gnss:
    enabled: true
    rate_hz: 5.0
    sigma_position_horizontal_m: 2.0
    sigma_position_vertical_m: 3.5
    sigma_velocity_mps: 0.10
    latency_s: 0.08
  imu:
    enabled: true
    rate_hz: 100.0
    accel_noise_density_mps2_sqrthz: 0.003
    gyro_noise_density_radps_sqrthz: 0.0002
    accel_bias_walk_mps2_sqrts: 0.0001
    gyro_bias_walk_radps_sqrts: 0.00001
  baro:
    enabled: true
    rate_hz: 20.0
    sigma_m: 0.6
  vision:
    enabled: true
    rate_hz: 20.0
    sigma_lateral_m: 0.8
    sigma_longitudinal_m: 3.0
    max_range_m: 3000.0

estimators: [gnss_only, ins_dr, ekf, integrity_ekf, solsep_ekf]

faults:
  - id: F-DUAL-SPOOF
    type: gnss_position_step
    target: gnss
    start_s: 30.0
    duration_s: -1
    amplitude_ned_m: [70.0, -60.0, 0.0]
  - id: F-DUAL-IMU
    type: imu_accel_bias
    target: imu
    start_s: 30.0
    duration_s: -1
    amplitude_body_mps2: [0.4, 0.25, 0.0]

acceptance:
  - id: AC-1
    description: >
      With two simultaneous faults the architecture must not still be claiming
      NORMAL at the end of the run. Declaring degraded, low confidence or unsafe
      is a pass; quietly publishing a fused position as if nothing had happened
      is the failure this criterion exists to catch.
    estimator: integrity_ekf
    forbid_end_mode: NORMAL
  - id: AC-2
    description: Same requirement for solution separation.
    estimator: solsep_ekf
    forbid_end_mode: NORMAL
