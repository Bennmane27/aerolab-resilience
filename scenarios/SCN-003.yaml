# SCN-003 - GNSS step spoof
# A 100 m instantaneous offset is added to the synthetic GNSS position at t=30 s. The clean case for innovation gating.
#
# Objective: Detection and isolation of an abrupt, large inconsistency (AT-004).
#
# Safety: every fault below is arithmetic applied to synthetic measurements
# inside this process. There is no radio, no signal generator and no receiver
# parameter anywhere in the project. See SECURITY_AND_SAFETY.md.

id: SCN-003
name: "GNSS step spoof"
description: "A 100 m instantaneous offset is added to the synthetic GNSS position at t=30 s. The clean case for innovation gating."
objective: "Detection and isolation of an abrupt, large inconsistency (AT-004)."

schema_version: 1
seed: 103
duration_s: 90
dt_s: 0.01
truth_profile: approach_ils_like

scene:
  runway_heading_deg: 140.0
  glideslope_deg: 3.0
  threshold_ned_m: [0.0, 0.0, 0.0]
  runway_length_m: 3000.0
  runway_width_m: 45.0

sensors:
  gnss:
    enabled: true
    rate_hz: 5.0
    sigma_position_horizontal_m: 2.0
    sigma_position_vertical_m: 3.5
    sigma_velocity_mps: 0.10
    latency_s: 0.08
  imu:
    enabled: true
    rate_hz: 100.0
    accel_noise_density_mps2_sqrthz: 0.003
    gyro_noise_density_radps_sqrthz: 0.0002
    accel_bias_walk_mps2_sqrts: 0.0001
    gyro_bias_walk_radps_sqrts: 0.00001
  baro:
    enabled: true
    rate_hz: 20.0
    sigma_m: 0.6
  vision:
    enabled: true
    rate_hz: 20.0
    sigma_lateral_m: 0.8
    sigma_longitudinal_m: 3.0
    max_range_m: 3000.0

estimators: [gnss_only, ins_dr, ekf, integrity_ekf, solsep_ekf]

faults:
  - id: F-STEP-SPOOF
    type: gnss_position_step
    target: gnss
    start_s: 30.0
    duration_s: -1
    amplitude_ned_m: [0.0, 100.0, 0.0]

acceptance:
  - id: AC-1
    description: >
      A 100 m step is roughly 50 sigma on a 2 m GNSS. An integrity architecture
      that misses it is broken, not merely weak.
    estimator: integrity_ekf
    require_detection: true
    require_isolation: true
    max_time_to_detect_s: 3.0
  - id: AC-2
    description: Solution separation must catch it too, and no later than the innovation gate.
    estimator: solsep_ekf
    require_detection: true
    max_time_to_detect_s: 3.0
  - id: AC-3
    description: >
      The plain EKF has no integrity layer at all. It is expected to absorb the
      spoof; it is the control case and by construction cannot isolate anything.
    estimator: ekf
    max_false_isolations: 0
