# SCN-004 - GNSS slow drift
# The synthetic GNSS position ramps 0 to 150 m east over 45 s from t=25 s. The adversarial case: the filter follows the ramp, the innovation stays small, and a chi-square gate on the innovation loses its power.
#
# Objective: Measure the detectability floor of innovation gating against solution separation. No outcome is presumed; a missed detection here is a published result, not a bug (section 8.1).
#
# Safety: every fault below is arithmetic applied to synthetic measurements
# inside this process. There is no radio, no signal generator and no receiver
# parameter anywhere in the project. See SECURITY_AND_SAFETY.md.

id: SCN-004
name: "GNSS slow drift"
description: "The synthetic GNSS position ramps 0 to 150 m east over 45 s from t=25 s. The adversarial case: the filter follows the ramp, the innovation stays small, and a chi-square gate on the innovation loses its power."
objective: "Measure the detectability floor of innovation gating against solution separation. No outcome is presumed; a missed detection here is a published result, not a bug (section 8.1)."

schema_version: 1
seed: 104
duration_s: 90
dt_s: 0.01
truth_profile: approach_ils_like

scene:
  runway_heading_deg: 140.0
  glideslope_deg: 3.0
  threshold_ned_m: [0.0, 0.0, 0.0]
  runway_length_m: 3000.0
  runway_width_m: 45.0

sensors:
  gnss:
    enabled: true
    rate_hz: 5.0
    sigma_position_horizontal_m: 2.0
    sigma_position_vertical_m: 3.5
    sigma_velocity_mps: 0.10
    latency_s: 0.08
  imu:
    enabled: true
    rate_hz: 100.0
    accel_noise_density_mps2_sqrthz: 0.003
    gyro_noise_density_radps_sqrthz: 0.0002
    accel_bias_walk_mps2_sqrts: 0.0001
    gyro_bias_walk_radps_sqrts: 0.00001
  baro:
    enabled: true
    rate_hz: 20.0
    sigma_m: 0.6
  vision:
    enabled: true
    rate_hz: 20.0
    sigma_lateral_m: 0.8
    sigma_longitudinal_m: 3.0
    max_range_m: 3000.0

estimators: [gnss_only, ins_dr, ekf, integrity_ekf, solsep_ekf]

faults:
  - id: F-SLOW-DRIFT
    type: gnss_position_ramp
    target: gnss
    start_s: 25.0
    duration_s: 45.0
    amplitude_ned_m: [0.0, 150.0, 0.0]

acceptance:
  - id: AC-1
    description: >
      The run must produce complete, finite metrics. It deliberately does NOT
      require a detection. Whether the innovation gate fires here is the
      measurement, and turning it into a pass criterion would be exactly the
      post-hoc tuning that section 8.1 forbids.
    estimator: any
    max_position_rmse_m: 100000.0
  - id: AC-2
    description: >
      Solution separation does not lose power as the ramp grows, so it is
      expected to detect. If this ever fails, the headline claim of the project
      is wrong and must be retracted - not the criterion relaxed.
    estimator: solsep_ekf
    require_detection: true
